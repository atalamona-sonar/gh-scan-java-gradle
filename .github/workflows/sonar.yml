name: sonar-scan
on:
  push:
    branches: [main]
  pull_request:
jobs:
  scan:
    runs-on: [self-hosted, lab99]
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build, test and scan
        run: gradle --no-daemon test jacocoTestReport sonar -Dsonar.host.url="$SONAR_HOST_URL"
